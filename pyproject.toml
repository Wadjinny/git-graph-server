[project]
name = "git-graph-server"
version = "0.1.0"
description = "Local web UI that draws your git branch graph, optionally linking rebased commits to their originals like merges"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
git-graph-server = "git_graph_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
